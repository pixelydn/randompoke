<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <!-- why does é just not work after I saved it, I have to use this e acute thing now -->
    <title>Random Pok&eacute;mon Generator</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
    <!-- import chart.js for my iv screen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>

    <!-- defer make script wait until page was loaded -->
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./styles.css">
    <!--
        log:
            2026-11-05: prototype
            2026-11-06: fetch from pokeapi, added iv chart
    -->
</head>

<body>
    <div class="pokedex">

        <div class="dex-left">
            <div class="sprite-container">
                <img class="sprite" src="" alt="pokemon">
                <p class="gender"></p>
                <p class="name"></p>
                <p class="color"></p>

                <!-- found this on pokeapi -->
                <span class="shiny-icon" title="Shiny">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M10 2L12.5 8L18 10L12.5 12L10 18L7.5 12L2 10L7.5 8Z"></path>
                        <path d="M19 15L20.2 18L23 19L20.2 20L19 23L17.8 20L15 19L17.8 18Z"></path>
                    </svg>
                </span>
            </div>
        </div>

        <div class="dex-hinge"></div>

        <div class="dex-right">
            <div class="iv-container">
                <canvas class="iv-chart"></canvas>
            </div>
            <div class="bst-container">
                <canvas class="bst-chart"></canvas>
            </div>
        </div>
    </div>
    <button class="generate">Generate</button>
</body>

</html>
